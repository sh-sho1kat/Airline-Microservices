server:
  port: 5005

spring:
  application:
    name: pricing-service

  datasource:
    url: jdbc:mysql://localhost:3306/pricing_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

app:
  jwt:
    secret: ${JWT_SECRET}

pricing:
  child-fare-percentage: ${CHILD_FARE_PERCENTAGE:100}
  infant-fare-percentage: ${INFANT_FARE_PERCENTAGE:10}