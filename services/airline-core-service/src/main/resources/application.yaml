server:
  port: 5002

spring:
  application:
    name: airline-core-service

  datasource:
    url: jdbc:mysql://localhost:3306/airline_core_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
